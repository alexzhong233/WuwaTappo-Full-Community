name: Build macOS

on:
  workflow_call:
    inputs:
      ref:
        description: Git revision to build
        required: false
        type: string
        default: ''
  # 平时只有同步工作流会调它，改了 Rust 或注入器却没有新版可跟的时候就没有验证入口。
  # 补一个手动触发，与 build-windows.yml 对齐：dispatch 不带 ref 时按所选分支的 HEAD 构建。
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.region }}
    runs-on: macos-15
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - region: cn
            artifact: WuwaTappo-Full-CN-Community
          - region: global
            artifact: WuwaTappo-Full-Global-Community
    env:
      WUWA_REGION: ${{ matrix.region }}
      WUWA_INSTALLER_MIRROR_BASE: ${{ github.server_url }}/${{ github.repository }}/releases/download/upstream-resources
      MACOSX_DEPLOYMENT_TARGET: '13.0'
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - name: Read pinned official installer cache identity
        id: installer
        run: node macos/scripts/installer-cache.mjs
      - name: Restore pinned official installer
        id: installer-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.installer.outputs.path }}
          key: ${{ steps.installer.outputs.key }}
      - name: Install build tools
        run: |
          test "$(uname -m)" = arm64
          rustup toolchain install 1.97.1 --profile minimal
          rustup default 1.97.1
          brew install sevenzip osslsigncode
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: cargo-cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            macos/src-tauri/target
          key: macos-arm64-${{ matrix.region }}-rust-1.97.1-${{ hashFiles('macos/src-tauri/Cargo.lock') }}
      - run: npm ci
      - name: Prepare verified regional resources and native build inputs
        id: prepare
        run: npm run setup
      - name: Save verified official installer
        if: steps.prepare.outcome == 'success' && steps.installer-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.installer.outputs.path }}
          key: ${{ steps.installer.outputs.key }}
      - name: Test frontend contracts and native backend
        id: native-tests
        run: |
          npm test
          npm run test:fullatlas
          npm run test:rust
      - name: Build complete application
        run: npm run build -- -- --locked
      - name: Verify and package DMG
        run: |
          set -o pipefail
          npm run package 2>&1 | tee macos/.work/package-macos.log
      - name: Keep packaging diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-package-diagnostics-${{ matrix.region }}
          path: macos/.work/package-macos.log
          if-no-files-found: ignore
          retention-days: 14
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.artifact }}-macOS-arm64
          path: |
            dist/*.dmg
          if-no-files-found: error
          retention-days: 14
      - name: Save compiled Cargo dependencies
        if: always() && steps.native-tests.outcome == 'success' && steps.cargo-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            macos/src-tauri/target
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}
