name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing integration version tag, for example v1.2.3
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  # 两个平台都必须构建成功才允许发版：Windows 只出 exe 安装包，macOS 只出 dmg。
  # 任何一个挂了，publish 直接不启动，不会出现"只发了一半平台"的 Release。
  build-macos:
    uses: ./.github/workflows/build.yml
    with:
      ref: ${{ github.event.inputs.tag || github.ref }}
  build-windows:
    uses: ./.github/workflows/build-windows.yml
    with:
      ref: ${{ github.event.inputs.tag || github.ref }}
  publish:
    needs: [build-macos, build-windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: WuwaTappo-*
          merge-multiple: true
          path: dist
      - name: Publish release with both platforms
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-(alpha|beta|rc)\.[0-9]+)?$ ]]
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync, existsSync } from 'node:fs';
          import { createHash } from 'node:crypto';
          const version = JSON.parse(readFileSync('package.json', 'utf8')).version;
          const cnLock = JSON.parse(readFileSync('macos/upstream-cn.json', 'utf8'));
          const globalLock = JSON.parse(readFileSync('macos/upstream-global.json', 'utf8'));
          const cn = cnLock.version;
          const global = globalLock.version;
          if (process.env.TAG !== `v${version}`) throw new Error('Tag does not match integration version');
          // 手工发版时最容易踩的坑：macOS 已经跟到新版、Windows 锁还停在上一版，
          // 于是同一个 Release 里两个平台的客户端不是同一代（alpha.1 就是这样）。
          // 同步工作流会一起改，这里再兜一层，宁可拒绝发版也不要发出半套基线。
          const windowsLocks = [
            ['国服', JSON.parse(readFileSync('windows/upstream-win.json', 'utf8')), cnLock],
            ['国际服', JSON.parse(readFileSync('windows/upstream-win-global.json', 'utf8')), globalLock],
          ];
          for (const [label, win, mac] of windowsLocks) {
            if (win.client_version !== mac.version) {
              throw new Error(`Windows ${label}基线 ${win.client_version} 与 macOS ${mac.version} 不一致：先让同步工作流把两平台锁对齐再发版`);
            }
            if (win.installer_sha256 !== mac.installer.sha256) {
              throw new Error(`Windows ${label}锁里的安装包哈希与 macOS 不是同一个官方包：镜像回退与完整性校验会各对各错`);
            }
          }
          // 六个产物缺一不可：两服 × 两平台（mac=dmg / win=exe），
          // Windows 每个服再带一个程序内升级 zip（桌宠里「一键更新」下载的就是它）。
          const expected = [
            `WuwaTappo-Full-CN-Community-${version}-macOS-arm64.dmg`,
            `WuwaTappo-Full-Global-Community-${version}-macOS-arm64.dmg`,
            `WuwaTappo-Full-CN-Community-Windows-x64-${version}.exe`,
            `WuwaTappo-Full-Global-Community-Windows-x64-${version}.exe`,
            `WuwaTappo-Full-CN-Community-${version}-win-x64-update.zip`,
            `WuwaTappo-Full-Global-Community-${version}-win-x64-update.zip`,
          ];
          const missing = expected.filter(name => !existsSync(`dist/${name}`));
          if (missing.length) throw new Error(`Release 缺少产物，两个平台都必须构建成功：${missing.join(', ')}`);
          // 升级包的身份写在 SHA256SUMS.txt 里，更新器下载完会按这个名字核对哈希。
          const sumLines = expected.map(name =>
            `${createHash('sha256').update(readFileSync(`dist/${name}`)).digest('hex')}  ${name}`);
          writeFileSync('dist/SHA256SUMS.txt', sumLines.join('\n') + '\n');
          const notes = `docs/macos/RELEASE_NOTES_${version}.md`;
          const body = existsSync(notes)
            ? readFileSync(notes, 'utf8')
            : `# WuwaTappo Full Community ${version}\n\n社区版整合了官方客户端的本地图鉴与桌宠能力，国服与国际服分开打包。\n\n- macOS：Apple Silicon / macOS 13 及以上，下载 \`.dmg\` 拖入「应用程序」\n- Windows：下载 \`.exe\` 安装后双击快捷方式即可使用；已装旧版可在控制台「更新」里一键升级\n\n实验预发布，完整业务仍需验收。\n`;
          writeFileSync('/tmp/release-notes.md', `${body}\n\n官方基底：国服 ${cn} / 国际服 ${global}。\n`);
          writeFileSync('/tmp/assets.txt', [...expected.map(name => `dist/${name}`), 'dist/SHA256SUMS.txt'].join('\n') + '\n');
          NODE
          mapfile -t FILES < /tmp/assets.txt
          for FILE in "${FILES[@]}"; do ls -la "$FILE"; done
          if compgen -G 'dist/*.sha256' > /dev/null; then
            FILES+=(dist/*.sha256)
          fi
          # 打 tag 就是发版，不再留草稿等人点发布；只有预发布号（-alpha/-beta/-rc）才打 prerelease 标记。
          if [[ "$TAG" == *-* ]]; then
            FLAGS=(--prerelease --latest=false)
          else
            FLAGS=(--prerelease=false --latest)
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            # 已存在时补齐文件并同步说明/发布状态：手建的空壳、上次跑剩的草稿都能被重跑修正。
            gh release upload "$TAG" "${FILES[@]}" --clobber
            gh release edit "$TAG" --title "WuwaTappo Full Community $TAG" --notes-file /tmp/release-notes.md --draft=false "${FLAGS[@]}"
          else
            gh release create "$TAG" "${FILES[@]}" --verify-tag --title "WuwaTappo Full Community $TAG" --notes-file /tmp/release-notes.md "${FLAGS[@]}"
          fi
