name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing integration version tag, for example v1.2.3
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  # 两个平台都必须构建成功才允许发版：Windows 只出 exe 安装包，macOS 只出 dmg。
  # 任何一个挂了，publish 直接不启动，不会出现"只发了一半平台"的 Release。
  build-macos:
    uses: ./.github/workflows/build.yml
    with:
      ref: ${{ github.event.inputs.tag || github.ref }}
  build-windows:
    uses: ./.github/workflows/build-windows.yml
    with:
      ref: ${{ github.event.inputs.tag || github.ref }}
  publish:
    needs: [build-macos, build-windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: WuwaTappo-*
          merge-multiple: true
          path: dist
      - name: Publish release with both platforms
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-(alpha|beta|rc)\.[0-9]+)?$ ]]
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync, existsSync } from 'node:fs';
          import { releaseAssetNames, writeReleaseChecksums } from './scripts/release-assets.mjs';
          const version = JSON.parse(readFileSync('package.json', 'utf8')).version;
          const cnLock = JSON.parse(readFileSync('shared/upstream/cn.json', 'utf8'));
          const globalLock = JSON.parse(readFileSync('shared/upstream/global.json', 'utf8'));
          const cn = cnLock.version;
          const global = globalLock.version;
          if (process.env.TAG !== `v${version}`) throw new Error('Tag does not match integration version');
          // 六个产物缺一不可：两服 × 两平台（mac=dmg / win=exe），
          // Windows 每个服再带一个程序内升级 zip（桌宠里「一键更新」下载的就是它）。
          const expected = releaseAssetNames(version);
          writeReleaseChecksums(version, process.cwd());
          // 发布说明按版本号取；docs 合并到根 docs/ 之后路径变了，找不到就退回通用正文。
          const notes = `docs/RELEASE_NOTES_${version}.md`;
          const body = existsSync(notes)
            ? readFileSync(notes, 'utf8')
            : `# WuwaTappo Full Community ${version}\n\n社区版整合了官方客户端的本地图鉴与桌宠能力，国服与国际服分开打包。\n\n- macOS：Apple Silicon / macOS 13 及以上，首次下载 \`.dmg\` 拖入「应用程序」；后续可在控制台「更新」里一键下载校验并自动替换重启（因临时签名，重启后按提示重授一次输入监控）\n- Windows：下载 \`.exe\` 安装后双击快捷方式即用；已装旧版可在控制台「更新」里一键升级\n\n实验预发布，完整业务仍需验收。\n`;
          writeFileSync('/tmp/release-notes.md', `${body}\n\n官方基底：国服 ${cn} / 国际服 ${global}。\n`);
          writeFileSync('/tmp/assets.txt', [...expected.map(name => `dist/${name}`), 'dist/SHA256SUMS.txt'].join('\n') + '\n');
          NODE
          mapfile -t FILES < /tmp/assets.txt
          for FILE in "${FILES[@]}"; do ls -la "$FILE"; done
          # 打 tag 就是发版，不再留草稿等人点发布；只有预发布号（-alpha/-beta/-rc）才打 prerelease 标记。
          if [[ "$TAG" == *-* ]]; then
            FLAGS=(--prerelease --latest=false)
          else
            FLAGS=(--prerelease=false --latest)
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            # 已存在时补齐文件并同步说明/发布状态：手建的空壳、上次跑剩的草稿都能被重跑修正。
            gh release upload "$TAG" "${FILES[@]}" --clobber
            gh release edit "$TAG" --title "WuwaTappo Full Community $TAG" --notes-file /tmp/release-notes.md --draft=false "${FLAGS[@]}"
          else
            gh release create "$TAG" "${FILES[@]}" --verify-tag --title "WuwaTappo Full Community $TAG" --notes-file /tmp/release-notes.md "${FLAGS[@]}"
          fi
