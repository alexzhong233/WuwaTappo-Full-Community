name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:
    inputs:
      full_build:
        description: Also run full macOS + Windows installer builds
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-macos:
    name: Fast Gate · macOS
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - name: Install Rust toolchain
        run: |
          rustup toolchain install 1.97.1 --profile minimal
          rustup default 1.97.1
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            shared/backend
            macos/src-tauri
      - run: npm ci
      - name: Run shared & macOS unit tests
        run: |
          npm run test:shared
          npm run test:mac
      - name: Run Rust unit tests (shared + CN + Global)
        run: |
          cargo test --locked --manifest-path shared/backend/Cargo.toml
          npm run test:rust
          WUWA_REGION=global npm run test:rust

  test-windows:
    name: Fast Gate · Windows
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: shared/backend
      - run: npm ci
      - name: Run shared & Windows unit tests
        shell: pwsh
        run: |
          npm run test:shared
          npm run test:win
      - name: Test shared Rust backend
        run: cargo test --locked --manifest-path shared/backend/Cargo.toml

  build:
    needs: [test-macos, test-windows]
    if: (github.event_name == 'push' && github.ref == 'refs/heads/dev') || (github.event_name == 'workflow_dispatch' && inputs.full_build == true)
    uses: ./.github/workflows/build.yml

  build-windows:
    needs: [test-macos, test-windows]
    if: (github.event_name == 'push' && github.ref == 'refs/heads/dev') || (github.event_name == 'workflow_dispatch' && inputs.full_build == true)
    uses: ./.github/workflows/build-windows.yml
