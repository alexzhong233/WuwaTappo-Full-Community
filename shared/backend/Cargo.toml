[package]
name = "wuwatappo-assistant-core"
version = "1.3.1"
edition = "2021"
rust-version = "1.85"

[lib]
name = "wuwatappo_assistant_core"
path = "src/lib.rs"

[[bin]]
name = "assistant-core"
path = "src/main.rs"

[[bin]]
name = "local-gallery-host"
path = "src/local_gallery_host.rs"

[[bin]]
name = "wuwatappo-launcher"
path = "src/windows_launcher.rs"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "=0.12.28", default-features = false, features = ["blocking", "json", "rustls-tls"] }
sha2 = "0.10"
tiny_http = "0.12"
zip = { version = "2.4", default-features = false, features = ["deflate"] }
